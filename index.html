    />



    <!-- Open Graph / Facebook -->

    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://partypass.pl/" />

    <meta property="twitter:image" content="https://partypass.pl/og-image.jpg" />

    <meta name="keywords" content="zarządzanie wydarzeniami, organizacja eventów, lista gości, RSVP, zaproszenia email, PartyPass, wydarzenia w Polsce" />

    <meta name="author" content="PartyPass" />

    <link rel="canonical" href="https://partypass.pl/" />



    <!-- Structured Data (JSON-LD) -->

    <script type="application/ld+json">

    {

      "@context": "https://schema.org",

      "@type": "SoftwareApplication",

      "name": "PartyPass",

      "description": "Platforma do organizacji wydarzeń: lista gości, zaproszenia e-mail, linki RSVP i analityka frekwencji.",

      "url": "https://partypass.pl",

      "applicationCategory": "BusinessApplication",

      "operatingSystem": "Web Browser",

      "offers": [

        {

          "@type": "Offer",

          "name": "Starter",

          "price": "0",

          "priceCurrency": "PLN"

        },

        {

          "@type": "Offer",

          "name": "Pro",

          "price": "29",

          "priceCurrency": "PLN",

          "priceSpecification": {

            "@type": "UnitPriceSpecification",

            "price": "29",

            "priceCurrency": "PLN",

            "referenceQuantity": {

              "@type": "QuantitativeValue",

              "value": "1",

              "unitText": "month"

            }

          }

        }

      ],

      "featureList": [

        "Zarządzanie wydarzeniami",

        "Lista gości i RSVP online",

        "Zaproszenia e-mail",

        "Analityki frekwencji",

        "QR kody dla gości",

        "SMS powiadomienia (plan Pro)"

      ],

      "publisher": {

        "@type": "Organization",

        "name": "PartyPass",

        "url": "https://partypass.pl",

        "email": "kontakt@partypass.pl"

      }

    }

    </script>



    <link rel="apple-touch-icon" href="/logo192.png" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
